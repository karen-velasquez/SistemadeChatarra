name: Deploy a Hostinger (SFTP)

# Se ejecuta automáticamente en cada push a la rama main.
# También se puede lanzar a mano desde la pestaña "Actions" de GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Subir cambios por SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Hostinger suele bloquear el FTP plano desde IPs externas (como las de
      # GitHub Actions), por eso se usa SFTP (puerto 65002), que sí permite.
      # Usa los mismos Secrets de usuario y contraseña que el FTP.
      - name: Subir archivos a Hostinger por SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002

          # Carpeta LOCAL de origen (la raíz del repo).
          local_path: './*'

          # Carpeta DESTINO en Hostinger.
          remote_path: '/public_html/chatarra'

          sftp_only: true
          delete_remote_files: false

          # Archivos y carpetas que NO se suben (patrón rsync).
          # vendor/ y .env ya están en el servidor y no deben tocarse.
          exclude: |
            .git*
            .github
            vendor
            node_modules
            .env
            storage/logs
            storage/framework/cache
            storage/framework/sessions
            storage/framework/views
            tests
